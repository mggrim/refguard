name = "refguard"
main = "web/worker.ts"
compatibility_date = "2026-08-01"

# The public address. Cloudflare creates the DNS record for a custom domain.
# workers.dev stays on so links already shared keep working.
routes = [{ pattern = "refguard.matthewgrim.es", custom_domain = true }]
workers_dev = true

[assets]
directory = "web/public"
binding = "ASSETS"

# Per-IP rate limiting, so one script cannot get the whole site throttled by
# Crossref. 120 audited entries per minute is far above a person pasting a
# bibliography and far below a scraper.
[[unsafe.bindings]]
name = "AUDIT_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 120, period = 60 }
